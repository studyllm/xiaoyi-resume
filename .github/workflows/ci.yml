name: CI

# 门禁只负责「在什么时机调起 verify」，检查内容由 frontend/scripts/verify.mjs 单一定义。
# 换用其它托管平台时，只需改写本文件里「怎么调起 verify」这一层。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 运行门禁
        working-directory: frontend
        run: npm run verify
