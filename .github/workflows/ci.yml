name: CI

# 门禁只负责「在什么时机调起 verify」，检查内容由 frontend/scripts/verify.mjs 单一定义。
# 换用其它托管平台时，只需改写本文件里「怎么调起 verify」这一层。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          # lockfile 在仓库根：npm workspace 的依赖装在根目录
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行门禁（前端）
        working-directory: frontend
        run: npm run verify

      - name: 运行门禁（服务端）
        working-directory: server
        run: npm run verify
