schema: spec-driven

context: |
  项目：小奕·简历。面向求职者的简历工具。用户维护一份简历底稿（界面显示「我的简历」），
  按不同 JD 生成多个互不影响的版本快照（界面显示「多 JD 版本」），导出 A4 PDF / Markdown / 纯文本投递。

  前后端同仓库：Vue 3.5 + TypeScript 5.7 + Pinia + Vite 6 + Element Plus 2.9 + Vitest 2，
  服务端是 Node + Fastify + Postgres。解析、诊断、JD 解析与版本生成跑在服务端，
  引擎源码在共享包 `packages/shared`，前端与服务端引用同一份。

  开发规范见仓库根目录的 AGENTS.md——那是唯一的规范来源，本文件不重复其中的内容。

  术语约定：文档内部用「底稿」「版本」保持定义精确；界面文案不得出现「底稿」，
  一律显示为「我的简历」「多 JD 版本」。

rules:
  proposal:
    - 需求澄清与系统设计是强制关卡（AGENTS.md §2.0）。proposal.md 的 `## Why` 段**开头**必须写这三行：
      `- 重量：重 | 轻`、`- 澄清文档：<路径> | 无（bug 流程）`、`- 系统设计：<路径> | 无（轻变更） | 无（bug 流程）`。
    - 重量按 AGENTS.md §2.0 的轻重表判：共享包引擎与领域类型、服务端接口与错误码、数据库与迁移、前后端契约 = 重；样式布局、单页交互与文案、单组件局部逻辑 = 轻。拿不准写「重」。
    - 需求流程（变更名不以 `fix-` 开头）必须先有 `docs/clarifications/<name>.md`；重量为「重」时还必须有 `docs/designs/<name>.md`。填的路径要真实存在。
    - bug 流程（变更名以 `fix-` 开头）澄清文档写「无（bug 流程）」、系统设计写「无（bug 流程）」。
    - Why 段要写清引用了哪份澄清文档的哪一节；写不出追溯说明前面那关没做实。

  design:
    - 重变更的 design.md 每条决策要能追溯到 `docs/designs/<name>.md` 的对应小节；写清是采纳了哪条、为什么与那里一致。
    - 轻变更的 design.md 说清怎么改，不必引用系统设计文档。
    - 决策要写备选与代价，只写结论的决策后来会被质疑，也没法改。

  specs:
    - 界面文案不得出现内部术语「底稿」，界面上显示为「我的简历」；「版本」在导航与页面标题中显示为「多 JD 版本」。
    - 需求要写成可验证的行为，场景用 WHEN/THEN 描述用户能观察到的结果，不描述实现方式。
    - 新建能力域时，除 delta spec 外还要给出该能力域的 `## Purpose`：它解决什么问题、当前边界在哪。归档工具不会搬运 Purpose，必须在归档后手工回填到 `openspec/specs/<能力域>/spec.md`。
    - 引擎产出的用户可见文案不得出现禁用词（面试、笔试、八股、考点、题库、题目、刷题、真题、面经）。

  tasks:
    - 若本次变更新建了能力域，任务清单必须包含一项：归档后回填 `openspec/specs/<能力域>/spec.md` 的 `## Purpose`，不得保留占位符。归档工具生成的骨架里这个段是硬编码的占位符，只能手工填。
    - 每条任务都要能对应一个可验证的行为，完成后能说清「怎么算做完了」。
    - 每条任务要能追溯到 `docs/designs/<name>.md` 的「开发任务拆分」或本次 design.md 的对应决策；追溯不到说明设计没做实。
    - 验收条件要区分两类：能靠测试断言的写「自动化验收」，只能靠浏览器看效果的写「浏览器验收」。不要在测试里断言 CSS 字符串存在。
    - 改动涉及界面时，任务清单要包含在浏览器里实际走一遍黄金路径的步骤。
